- name: Replace OS_REGION_NAME when target is a subcloud
  replace:
    path: "{{ deploy_config }}"
    regexp: '^(\s*OS_REGION_NAME:).*$'
    replace: '\1 {{ os_region_name }}'
  when: >-
    distributed_cloud_role == "subcloud" or
    distributed_cloud_role == ""

# Taken on the target, in the format of the Kubernetes event timestamps: only
# the system API failures seen since then are reported, so that the events
# left by a previous run are not, see roles/common/monitor-errors.
- name: Get the time the deployment configuration is applied
  command: date -u +%Y-%m-%dT%H:%M:%SZ
  register: dm_config_apply_date
  changed_when: false

- set_fact:
    dm_config_applied_at: "{{ dm_config_apply_date.stdout }}"

- name: Apply deployment configuration with retries
  block:
    - name: Apply deployment configuration file
      shell: kubectl apply -f {{ deploy_config }}
      environment:
        KUBECONFIG: "/etc/kubernetes/admin.conf"
      register: apply_deploy_config

  rescue:
    - name: Retry apply deployment configuration
      shell: kubectl apply -f {{ deploy_config }}
      environment:
        KUBECONFIG: "/etc/kubernetes/admin.conf"
      register: apply_deploy_config
      retries: 3
      delay: 10
      until: apply_deploy_config.rc == 0
      failed_when: false

    - name: Fail if all retries exhausted
      fail:
        msg:
          - "Failed to apply deployment configuration after
            {{ apply_deploy_config.attempts + 2 }} attempts."
          - "stderr: {{ apply_deploy_config.stderr }}"
          - "stdout: {{ apply_deploy_config.stdout }}"
      when: apply_deploy_config.rc != 0
