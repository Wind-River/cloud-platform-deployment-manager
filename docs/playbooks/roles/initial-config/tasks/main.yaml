- name: Mark the bootstrap as finalized
  file:
    path: "{{ config_permdir }}/.bootstrap_finalized"
    state: touch
  become: true

- import_tasks:
    file: apply-app.yaml

# Before the configuration is applied: the deployment manager unlocks the host
# as soon as it has been, and copying to a host that is going down fails.
- name: Stage the unlock scripts
  include_role:
    name: common/lock-unlock
    tasks_from: prepare
  when:
    - deploy_config is defined
    - distributed_cloud_role == "subcloud"

- include_role:
    name: common/apply-config
  when: deploy_config is defined

- name: Get the desired administrative state from host/hostprofile resources
  include_role:
    name: common/get-administrative-state
  when: deploy_config is defined

- name: Monitor unlock and wait until all resources are reconciled
  when:
    - deploy_config is defined
    - administrative_state == "unlocked"
    - distributed_cloud_role == "subcloud"
  block:
    - name: Wait for the unlock reboot triggered by the deployment manager
      include_role:
        name: common/lock-unlock
      when: current_administrative_state == "locked"

    - name: Wait until hosts are configurable and resources are reconciled
      include_role:
        name: common/monitor-deployment
